<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ali Cook</title><style>body{font-family:system-ui;margin:0;background:#f7f7f7;color:#222}header{background:#fff;padding:18px;position:sticky;top:0;box-shadow:0 1px 4px #ddd}h1{margin:0 0 12px}input,select{padding:12px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box;width:100%;margin:4px 0}main{padding:12px 12px 100px}.item{background:white;border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer}small{color:#666}button{padding:10px;border:0;border-radius:8px;background:#1c7d53;color:white}.back{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom, 0px));z-index:9999;min-height:54px;font-size:18px;font-weight:700;box-shadow:0 3px 12px #0003;touch-action:manipulation}li{margin:8px 0} .product-controls{display:flex;gap:8px;margin:10px 0}.product-controls button{flex:1}.product-panel{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px}.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:230px;overflow:auto}.product-choice{background:#f2f4f5;color:#222;text-align:left;font-size:14px;min-height:42px}.product-choice.selected{background:#1c7d53;color:white}.status{font-size:13px;color:#555}.hidden{display:none!important} </style></head><body><header><h1>Ali Cook</h1><input id="search" placeholder="Поиск рецептов"><select id="category"><option value="">Все категории</option></select></header><main><div class="product-controls"><button id="recipes-tab">Все блюда</button><button id="products-tab">Выбор продуктов</button></div><section id="products-panel" class="product-panel hidden"><h3>Что есть дома?</h3><p class="status">Отметь продукты — покажем, что можно приготовить.</p><input id="product-search" placeholder="Найти продукт"><div id="product-count" class="status"></div><div id="product-grid" class="product-grid"></div><div class="product-controls"><button id="clear-products">Очистить выбор</button><button id="show-matches">Подобрать блюда</button></div></section><div id="matches-info" class="status"></div><div id="app"></div></main><script>const catalog={"title":"Ali Cook","count":520,"calories_note":"Ориентировочная энергия на всю закладку, не на порцию. Значения приблизительные.","recipe_note":"Новые рецепты — рабочие домашние версии, не этнографически подтверждённые каноны. Для субпродуктов, сырого мяса и молочных продуктов соблюдайте пищевую безопасность.","recipes":[{"id":1,"title":"Омлет с сыром","category":"Основные блюда","ingredients":[{"name":"яйца","grams":110},{"name":"сыр","grams":35},{"name":"молоко","grams":30},{"name":"масло сливочное","grams":8}],"steps":["Взбейте яйца с молоком.","Натрите сыр.","Растопите масло, влейте смесь и готовьте под крышкой 4–5 минут.","Посыпьте сыром и прогрейте до расплавления."],"time_minutes":10,"calories_kcal_estimated_total":340,"photo":"AliCook_80_фото/01.jpg"},{"id":2,"title":"Жареный картофель","category":"Основные блюда","ingredients":[{"name":"картофель","grams":250},{"name":"масло растительное","grams":18},{"name":"лук","grams":50}],"steps":["Нарежьте картофель брусочками, промойте и обсушите.","Обжаривайте в масле 15–18 минут, периодически переворачивая.","Добавьте лук и доведите до готовности."],"time_minutes":25,"calories_kcal_estimated_total":370,"photo":"AliCook_80_фото/02.jpg"},{"id":3,"title":"Картофельное пюре","category":"Основные блюда","ingredients":[{"name":"картофель","grams":250},{"name":"молоко","grams":70},{"name":"масло сливочное","grams":15}],"steps":["Отварите очищенный картофель 20 минут.","Слейте воду, разомните, добавьте тёплое молоко и масло.","Перемешайте до однородности."],"time_minutes":30,"calories_kcal_estimated_total":320,"photo":"AliCook_80_фото/03.jpg"},{"id":4,"title":"Салат из огурцов и помидоров","category":"Основные блюда","ingredients":[{"name":"огурцы","grams":150},{"name":"помидоры","grams":150},{"name":"лук","grams":25},{"name":"масло растительное","grams":10}],"steps":["Вымойте овощи.","Нарежьте ломтиками, лук — тонкими полукольцами.","Посолите и заправьте маслом перед подачей."],"time_minutes":10,"calories_kcal_estimated_total":145,"photo":"AliCook_80_фото/04.jpg"},{"id":5,"title":"Макароны с сыром","category":"Основные блюда","ingredients":[{"name":"макароны сухие","grams":90},{"name":"сыр","grams":45},{"name":"молоко","grams":60},{"name":"масло сливочное","grams":10}],"steps":["Отварите макароны до готовности.","Подогрейте молоко с маслом, добавьте тёртый сыр.","Смешайте соус с макаронами."],"time_minutes":20,"calories_kcal_estimated_total":550,"photo":"AliCook_80_фото/05.jpg"},{"id":6,"title":"Гречка с луком","category":"Основные блюда","ingredients":[{"name":"гречка сухая","grams":80},{"name":"лук","grams":80},{"name":"масло растительное","grams":12},{"name":"вода","grams":180}],"steps":["Промойте гречку, варите в воде 15–18 минут.","Обжарьте нарезанный лук в масле и соедините с кашей."],"time_minutes":25,"calories_kcal_estimated_total":410,"photo":"AliCook_80_фото/06.jpg"},{"id":7,"title":"Куриный суп","category":"Основные блюда","ingredients":[{"name":"курица","grams":130},{"name":"картофель","grams":120},{"name":"морковь","grams":50},{"name":"лук","grams":40},{"name":"вода","grams":500}],"steps":["Залейте курицу водой и варите 25 минут, снимая пену.","Добавьте нарезанные овощи, готовьте ещё 15–20 минут до мягкости."],"time_minutes":50,"calories_kcal_estimated_total":300,"photo":"AliCook_80_фото/07.jpg"},{"id":8,"title":"Плов с говядиной","category":"Основные блюда","ingredients":[{"name":"говядина","grams":160},{"name":"рис сухой","grams":90},{"name":"морковь","grams":100},{"name":"лук","grams":70},{"name":"масло растительное","grams":20},{"name":"чеснок","grams":10},{"name":"вода","grams":180}],"steps":["Обжарьте мясо, лук и морковь.","Добавьте специи и немного воды, тушите 35 минут.","Выложите промытый рис, влейте воду и готовьте под крышкой 20 минут; дайте настояться."],"time_minutes":85,"calories_kcal_estimated_total":720,"photo":"AliCook_80_фото/08.jpg"},{"id":9,"title":"Плов с бараниной","category":"Основные блюда","ingredients":[{"name":"баранина","grams":160},{"name":"рис сухой","grams":90},{"name":"морковь","grams":100},{"name":"лук","grams":70},{"name":"масло растительное","grams":15},{"name":"чеснок","grams":10},{"name":"вода","grams":180}],"steps":["Обжарьте баранину с луком и морковью.","Тушите с небольшим количеством воды 40 минут.","Добавьте рис, чеснок и воду, готовьте 20 минут под крышкой."],"time_minutes":95,"calories_kcal_estimated_total":730,"photo":"AliCook_80_фото/09.jpg"},{"id":10,"title":"Рис с овощами","category":"Основные блюда","ingredients":[{"name":"рис сухой","grams":80},{"name":"морковь","grams":70},{"name":"перец сладкий","grams":80},{"name":"горошек зелёный","grams":60},{"name":"масло растительное","grams":12},{"name":"вода","grams":170}],"steps":["Отварите рис.","Нарежьте овощи, обжарьте 5–7 минут, добавьте горошек.","Смешайте с рисом и прогрейте."],"time_minutes":30,"calories_kcal_estimated_total":430,"photo":"AliCook_80_фото/10.jpg"},{"id":11,"title":"Котлеты из фарша","category":"Основные блюда","ingredients":[{"name":"фарш мясной","grams":180},{"name":"лук","grams":50},{"name":"яйцо","grams":25},{"name":"сухари панировочные","grams":20},{"name":"масло растительное","grams":12}],"steps":["Смешайте фарш с луком, яйцом и сухарями.","Сформируйте котлеты.","Обжарьте с двух сторон и доведите под крышкой до полной готовности."],"time_minutes":30,"calories_kcal_estimated_total":540,"photo":"AliCook_80_фото/11.jpg"},{"id":12,"title":"Оладьи","category":"Основные блюда","ingredients":[{"name":"кефир","grams":160},{"name":"мука","grams":120},{"name":"яйцо","grams":50},{"name":"сахар","grams":12},{"name":"масло растительное","grams":12},{"name":"разрыхлитель","grams":4}],"steps":["Смешайте кефир, яйцо и сахар.","Введите муку и разрыхлитель.","Жарьте небольшие оладьи на умеренном огне по 2–3 минуты с каждой стороны."],"time_minutes":25,"calories_kcal_estimated_total":640,"photo":"AliCook_80_фото/12.jpg"},{"id":13,"title":"Блины","category":"Основные блюда","ingredients":[{"name":"молоко","grams":200},{"name":"мука","grams":100},{"name":"яйцо","grams":50},{"name":"сахар","grams":10},{"name":"масло растительное","grams":10}],"steps":["Взбейте молоко с яйцом.","Добавьте муку и сахар, затем масло.","Выпекайте тонкие блины на разогретой сковороде."],"time_minutes":25,"calories_kcal_estimated_total":600,"photo":"AliCook_80_фото/13.jpg"},{"id":14,"title":"Сырники","category":"Основные блюда","ingredients":[{"name":"творог","grams":180},{"name":"яйцо","grams":25},{"name":"мука","grams":35},{"name":"сахар","grams":15},{"name":"масло растительное","grams":10}],"steps":["Разотрите творог с яйцом и сахаром.","Добавьте муку, сформируйте сырники.","Жарьте на среднем огне до готовности с двух сторон."],"time_minutes":25,"calories_kcal_estimated_total":500,"photo":"AliCook_80_фото/14.jpg"},{"id":15,"title":"Шакшука","category":"Основные блюда","ingredients":[{"name":"яйца","grams":110},{"name":"помидоры","grams":200},{"name":"перец сладкий","grams":80},{"name":"лук","grams":60},{"name":"масло растительное","grams":12}],"steps":["Обжарьте лук и перец, добавьте помидоры и тушите 8 минут.","Сделайте углубления, вбейте яйца.","Готовьте под крышкой до схватывания белка."],"time_minutes":25,"calories_kcal_estimated_total":400,"photo":"AliCook_80_фото/15.jpg"},{"id":16,"title":"Борщ","category":"Основные блюда","ingredients":[{"name":"говядина","grams":100},{"name":"свёкла","grams":120},{"name":"капуста","grams":120},{"name":"картофель","grams":100},{"name":"морковь","grams":50},{"name":"лук","grams":50},{"name":"томатная паста","grams":25},{"name":"вода","grams":600}],"steps":["Сварите мясной бульон.","Добавьте картофель и капусту.","Отдельно потушите свёклу, морковь, лук и томатную пасту.","Соедините и варите до готовности."],"time_minutes":85,"calories_kcal_estimated_total":380,"photo":"AliCook_80_фото/16.jpg"},{"id":17,"title":"Щи","category":"Основные блюда","ingredients":[{"name":"капуста","grams":180},{"name":"картофель","grams":120},{"name":"морковь","grams":60},{"name":"лук","grams":50},{"name":"курица","grams":100},{"name":"вода","grams":600}],"steps":["Сварите курицу до мягкости.","Добавьте картофель, затем капусту, морковь и лук.","Варите до мягкости овощей."],"time_minutes":55,"calories_kcal_estimated_total":290,"photo":"AliCook_80_фото/17.jpg"},{"id":18,"title":"Суп из чечевицы","category":"Основные блюда","ingredients":[{"name":"чечевица сухая","grams":90},{"name":"морковь","grams":70},{"name":"лук","grams":60},{"name":"томат","grams":80},{"name":"масло растительное","grams":10},{"name":"вода","grams":550}],"steps":["Промойте чечевицу.","Обжарьте лук с морковью, добавьте томат, чечевицу и воду.","Варите 25–30 минут."],"time_minutes":40,"calories_kcal_estimated_total":460,"photo":"AliCook_80_фото/18.jpg"},{"id":19,"title":"Гороховый суп","category":"Основные блюда","ingredients":[{"name":"горох сухой","grams":90},{"name":"картофель","grams":120},{"name":"морковь","grams":60},{"name":"лук","grams":50},{"name":"масло растительное","grams":8},{"name":"вода","grams":600}],"steps":["Замочите горох при необходимости.","Варите до размягчения, затем добавьте картофель и обжаренные овощи.","Доведите до готовности."],"time_minutes":75,"calories_kcal_estimated_total":470,"photo":"AliCook_80_фото/19.jpg"},{"id":20,"title":"Тушёная капуста","category":"Основные блюда","ingredients":[{"name":"капуста","grams":300},{"name":"морковь","grams":70},{"name":"лук","grams":60},{"name":"томатная паста","grams":25},{"name":"масло растительное","grams":15},{"name":"вода","grams":80}],"steps":["Обжарьте лук с морковью.","Добавьте нашинкованную капусту, томат и воду.","Тушите под крышкой 25–30 минут."],"time_minutes":40,"calories_kcal_estimated_total":260,"photo":"AliCook_80_фото/20.jpg"},{"id":21,"title":"Овощное рагу","category":"Основные блюда","ingredients":[{"name":"кабачок","grams":150},{"name":"баклажан","grams":120},{"name":"картофель","grams":120},{"name":"перец сладкий","grams":90},{"name":"помидоры","grams":120},{"name":"лук","grams":60},{"name":"масло растительное","grams":15}],"steps":["Нарежьте овощи.","Сначала обжарьте лук и картофель, затем добавьте остальные овощи.","Тушите под крышкой до мягкости."],"time_minutes":40,"calories_kcal_estimated_total":360,"photo":"AliCook_80_фото/21.jpg"},{"id":22,"title":"Запечённая рыба","category":"Дополнительные блюда","ingredients":[{"name":"рыбное филе","grams":220},{"name":"лимон","grams":30},{"name":"масло растительное","grams":10},{"name":"соль","grams":3}],"steps":["Промойте и обсушите рыбное филе.","Посолите, сбрызните лимонным соком и маслом.","Выложите в форму и запекайте при 180 °C около 20–30 минут, до полной готовности."],"time_minutes":35,"photo":null},{"id":23,"title":"Салат с тунцом","category":"Основные блюда","ingredients":[{"name":"тунец консервированный","grams":120},{"name":"огурцы","grams":120},{"name":"помидоры","grams":120},{"name":"листья салата","grams":50},{"name":"масло оливковое","grams":10}],"steps":["Слейте жидкость с тунца.","Нарежьте овощи, смешайте с листьями салата и тунцом.","Заправьте маслом."],"time_minutes":10,"calories_kcal_estimated_total":310,"photo":"AliCook_80_фото/23.jpg"},{"id":24,"title":"Овсяная каша","category":"Дополнительные блюда","ingredients":[{"name":"овсяные хлопья","grams":60},{"name":"молоко","grams":200},{"name":"вода","grams":100},{"name":"масло сливочное","grams":8}],"steps":["Доведите смесь молока и воды до слабого кипения.","Всыпьте хлопья, помешивая.","Варите 5–10 минут до мягкости и добавьте масло."],"time_minutes":15,"photo":null},{"id":25,"title":"Манная каша","category":"Дополнительные блюда","ingredients":[{"name":"манная крупа","grams":40},{"name":"молоко","grams":250},{"name":"сахар","grams":8},{"name":"масло сливочное","grams":8}],"steps":["Нагрейте молоко почти до кипения.","Тонкой струйкой ром","category":"Основные блюда","ingredients":[{"name":"макароны сухие","grams":90},{"name":"сыр","grams":45},{"name":"молоко","grams":60},{"name":"масло сливочное","grams":10}],"steps":["Отварите макароны до готовности.","Подогрейте молоко с маслом, добавьте тёртый сыр.","Смешайте соус с макаронами."],"time_minutes":20,"calories_kcal_estimated_total":550,"photo":"AliCook_80_фото/05.jpg"},{"id":6,"title":"Гречка с луком","category":"Основные блюда","ingredients":[{"name":"гречка сухая","grams":80},{"name":"лук","grams":80},{"name":"масло растительное","grams":12},{"name":"вода","grams":180}],"steps":["Промойте гречку, варите в воде 15–18 минут.","Обжарьте нарезанный лук в масле и соедините с кашей."],"time_minutes":25,"calories_kcal_estimated_total":410,"photo":"AliCook_80_фото/06.jpg"},{"id":7,"title":"Куриный суп","category":"Основные блюда","ingredients":[{"name":"курица","grams":130},{"name":"картофель","grams":120},{"name":"морковь","grams":50},{"name":"лук","grams":40},{"name":"вода","grams":500}],"steps":["Залейте курицу водой и варите 25 минут, снимая пену.","Добавьте нарезанные овощи, готовьте ещё 15–20 минут до мягкости."],"time_minutes":50,"calories_kcal_estimated_total":300,"photo":"AliCook_80_фото/07.jpg"},{"id":8,"title":"Плов с говядиной","category":"Основные блюда","ingredients":[{"name":"говядина","grams":160},{"name":"рис сухой","grams":90},{"name":"морковь","grams":100},{"name":"лук","grams":70},{"name":"масло растительное","grams":20},{"name":"чеснок","grams":10},{"name":"вода","grams":180}],"steps":["Обжарьте мясо, лук и морковь.","Добавьте специи и немного воды, тушите 35 минут.","Выложите промытый рис, влейте воду и готовьте под крышкой 20 минут; дайте настояться."],"time_minutes":85,"calories_kcal_estimated_total":720,"photo":"AliCook_80_фото/08.jpg"},{"id":9,"title":"Плов с бараниной","category":"Основные блюда","ingredients":[{"name":"баранина","grams":160},{"name":"рис сухой","grams":90},{"name":"морковь","grams":100},{"name":"лук","grams":70},{"name":"масло растительное","grams":15},{"name":"чеснок","grams":10},{"name":"вода","grams":180}],"steps":["Обжарьте баранину с луком и морковью.","Тушите с небольшим количеством воды 40 минут.","Добавьте рис, чеснок и воду, готовьте 20 минут под крышкой."],"time_minutes":95,"calories_kcal_estimated_total":730,"photo":"AliCook_80_фото/09.jpg"},{"id":10,"title":"Рис с овощами","category":"Основные блюда","ingredients":[{"name":"рис сухой","grams":80},{"name":"морковь","grams":70},{"name":"перец сладкий","grams":80},{"name":"горошек зелёный","grams":60},{"name":"масло растительное","grams":12},{"name":"вода","grams":170}],"steps":["Отварите рис.","Нарежьте овощи, обжарьте 5–7 минут, добавьте горошек.","Смешайте с рисом и прогрейте."],"time_minutes":30,"calories_kcal_estimated_total":430,"photo":"AliCook_80_фото/10.jpg"},{"id":11,"title":"Котлеты из фарша","category":"Основные блюда","ingredients":[{"name":"фарш мясной","grams":180},{"name":"лук","grams":50},{"name":"яйцо","grams":25},{"name":"сухари панировочные","grams":20},{"name":"масло растительное","grams":12}],"steps":["Смешайте фарш с луком, яйцом и сухарями.","Сформируйте котлеты.","Обжарьте с двух сторон и доведите под крышкой до полной готовности."],"time_minutes":30,"calories_kcal_estimated_total":540,"photo":"AliCook_80_фото/11.jpg"},{"id":12,"title":"Оладьи","category":"Основные блюда","ingredients":[{"name":"кефир","grams":160},{"name":"мука","grams":120},{"name":"яйцо","grams":50},{"name":"сахар","grams":12},{"name":"масло растительное","grams":12},{"name":"разрыхлитель","grams":4}],"steps":["Смешайте кефир, яйцо и сахар.","Введите муку и разрыхлитель.","Жарьте небольшие оладьи на умеренном огне по 2–3 минуты с каждой стороны."],"time_minutes":25,"calories_kcal_estimated_total":640,"photo":"AliCook_80_фото/12.jpg"},{"id":13,"title":"Блины","category":"Основные блюда","ingredients":[{"name":"молоко","grams":200},{"name":"мука","grams":100},{"name":"яйцо","grams":50},{"name":"сахар","grams":10},{"n ==cat)&&r.title.toLowerCase().includes(q));app.innerHTML='<small>'+list.length+' рецептов</small>'+list.map(r=>'<div class="item" data-id="'+r.id+'"><b>'+esc(r.title)+'</b><p><small>'+esc(r.category)+' · '+(r.time_minutes||'?')+' мин</small></p></div>').join('');app.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>show(+el.dataset.id))}function show(id){let r=recipes.find(x=>x.id===id);document.querySelector('header').style.display='none';document.querySelector('.product-controls').style.display='none';info.style.display='none';const ingredients=r.ingredients.length?r.ingredients.map(i=>'<li>'+esc(i.name)+' — '+esc(i.grams)+' г</li>').join(''):'<li>Состав пока не добавлен</li>';const steps=r.steps.length?r.steps.map(x=>'<li>'+esc(x)+'</li>').join(''):'<li>Пошаговый рецепт пока не добавлен</li>';app.innerHTML='<button class="back" id="back">← Назад</button><h2>'+esc(r.title)+'</h2><p>'+esc(r.category)+(r.time_minutes?' · '+r.time_minutes+' мин':'')+'</p><h3>Ингредиенты</h3><ul>'+ingredients+'</ul><h3>Приготовление</h3><ol>'+steps+'</ol>';document.getElementById('back').onclick=()=>{document.querySelector('header').style.display='block';document.querySelector('.product-controls').style.display='flex';info.style.display='block';render()}}const panel=document.getElementById('products-panel'),grid=document.getElementById('product-grid'),psearch=document.getElementById('product-search'),counter=document.getElementById('product-count'),info=document.getElementById('matches-info');
const allProducts=[...new Set(recipes.flatMap(r=>r.ingredients.map(i=>i.name.trim().toLowerCase())))].sort((a,b)=>a.localeCompare(b,'ru'));

document.getElementById('products-tab').onclick=()=>{document.querySelector('header').style.display='block';panel.classList.remove('hidden');renderProducts();window.scrollTo(0,0)};
