до готовности."],"time_minutes":25,"calories_kcal_estimated_total":370,"photo":"AliCook_80_фото/02.jpg"},{"id":3,"title":"Картофельное пюре","category":"Основные блюда","ingredients":[{"name":"картофель","grams":250},{"name":"молоко","grams":70},{"name":"масло сливочное","grams":15}],"steps":["Отварите очищенный картофель 20 минут.","Слейте воду, разомните, добавьте тёплое молоко и масло.","Перемешайте до однородности."],"time_minutes":30,"calories_kcal_estimated_total":320,"photo":"AliCook_80_фото/03.jpg"},{"id":4,"title":"Салат из огурцов и помидоров","category":"Основные блюда","ingredients":[{"name":"огурцы","grams":150},{"name":"помидоры","grams":150},{"name":"лук","grams":25},{"name":"масло растительное","grams":10}],"steps":["Вымойте овощи.","Нарежьте ломтиками, лук — тонкими полукольцами.","Посолите и заправьте маслом перед подачей."],"time_minutes":10,"calories_kcal_estimated_total":145,"photo":"AliCook_80_фото/04.jpg"},{"id":5,"title":"Макароны с сыром","category":"Основные блюда","ingredients":[{"name":"макароны сухие","grams":90},{"name":"сыр","grams":45},{"name":"молоко","grams":60},{"name":"масло сливочное","grams":10}],"steps":["Отварите макароны до готовности.","Подогрейте молоко с маслом, добавьте тёртый сыр.","Смешайте соус с макаронами."],"time_minutes":20,"calories_kcal_estimated_total":550,"photo":"AliCook_80_фото/05.jpg"},{"id":6,"title":"Гречка с луком","category":"Основные блюда","ingredients":[{"name":"гречка сухая","grams":80},{"name":"лук","grams":80},{"name":"масло растительное","grams":12},{"name":"вода","grams":180}],"steps":["Промойте гречку, варите в воде 15–18 минут.","Обжарьте нарезанный лук в масле и соедините с кашей."],"time_minutes":25,"calories_kcal_estimated_total":410,"photo":"AliCook_80_фото/06.jpg"},{"id":7,"title":"Куриный суп","category":"Основные блюда","ingredients":[{"name":"курица","grams":130},{"name":"картофель","grams":120},{"name":"морковь","grams":50},{"name":"лук","grams":40},{"name":"вода","grams":500}],"steps":["Залейте курицу водой и варите 25 минут, снимая пену.","Добавьте нарезанные овощи, готовьте ещё 15–20 минут до мягкости."],"time_minutes":50,"calories_kcal_estimated_total":300,"photo":"AliCook_80_фото/07.jpg"},{"id":8,"title":"Плов с говядиной","category":"Основные блюда","ingredients":[{"name":"говядина","grams":160},{"name":"рис сухой","grams":90},{"name":"морковь","grams":100},{"name":"лук","grams":70},{"name":"масло растительное","grams":20},{"name":"чеснок","grams":10},{"name":"вода","grams":180}],"steps":["Обжарьте мясо, лук и морковь.","Добавьте специи и немного воды, тушите 35 минут.","Выложите промытый рис, влейте воду и готовьте под крышкой 20 минут; дайте настояться."],"time_minutes":85,"calories_kcal_estimated_total":720,"photo":"AliCook_80_фото/08.jpg"},{"id":9,"title":"Плов с бараниной","category":"Основные блюда","ingredients":[{"name":"баранина","grams":160},{"name":"рис сухой","grams":90},{"name":"морковь","grams":100},{"name":"лук","grams":70},{"name":"масло растительное","grams":15},{"name":"чеснок","grams":10},{"name":"вода","grams":180}],"steps":["Обжарьте баранину с луком и морковью.","Тушите с небольшим количеством воды 40 минут.","Добавьте рис, чеснок и воду, готовьте 20 минут под крышкой."],"time_minutes":95,"calories_kcal_estimated_total":730,"photo":"AliCook_80_фото/09.jpg"},{"id":10,"title":"Рис с овощами","category":"Основные блюда","ingredients":[{"name":"рис сухой","grams":80},{"name":"морковь","grams":70},{"name":"перец сладкий","grams":80},{"name":"горошек зелёный","grams":60},{"name":"масло растительное","grams":12},{"name":"вода","grams":170}],"steps":["Отварите рис.","Нарежьте овощи, обжарьте 5–7 минут, добавьте горошек.","Смешайте с рисом и прогрейте."],"time_minutes":30,"calories_kcal_estimated_total":430,"photo":"AliCook_80_фото/10.jpg"},{"id":11,"title":"Котлеты из фарша","category":"Основные блюда","ingredients":[{"name":"фарш мясной","grams":180},{"name":"лук","grams":50},{"name":"яйцо","grams":25},{"name":"сухари панировочные","grams":20},{"name":"масло растительное","grams":12}],"steps":["Смешайте фарш с луком, яйцом и сухарями.","Сформируйте котлеты.","Обжарьте с двух сторон и доведите под крышкой до полной готовности."],"time_minutes":30,"calories_kcal_estimated_total":540,"photo":"AliCook_80_фото/11.jpg"},{"id":12,"title":"Оладьи","category":"Основные блюда","ingredients":[{"name":"кефир","grams":160},{"name":"мука","grams":120},{"name":"яйцо","grams":50},{"name":"сахар","grams":12},{"name":"масло растительное","grams":12},{"name":"разрыхлитель","grams":4}],"steps":["Смешайте кефир, яйцо и сахар.","Введите муку и разрыхлитель.","Жарьте небольшие оладьи на умеренном огне по 2–3 минуты с каждой стороны."],"time_minutes":25,"calories_kcal_estimated_total":640,"photo":"AliCook_80_фото/12.jpg"},{"id":13,"title":"Блины","category":"Основные блюда","ingredients":[{"name":"молоко","grams":200},{"name":"мука","grams":100},{"name":"яйцо","grams":50},{"name":"сахар","grams":10},{"name":"масло растительное","grams":10}],"steps":["Взбейте молоко с яйцом.","Добавьте муку и сахар, затем масло.","Выпекайте тонкие блины на разогретой сковороде."],"time_minutes":25,"calories_kcal_estimated_total":600,"photo":"AliCook_80_фото/13.jpg"},{"id":14,"title":"Сырники","category":"Основные блюда","ingredients":[{"name":"творог","grams":180},{"name":"яйцо","grams":25},{"name":"мука","grams":35},{"name":"сахар","grams":15},{"name":"масло растительное","grams":10}],"steps":["Разотрите творог с яйцом и сахаром.","Добавьте муку, сформируйте сырники.","Жарьте на среднем огне до готовности с двух сторон."],"time_minutes":25,"calories_kcal_estimated_total":500,"photo":"AliCook_80_фото/14.jpg"},{"id":15,"title":"Шакшука","category":"Основные блюда","ingredients":[{"name":"яйца","grams":110},{"name":"помидоры","grams":200},{"name":"перец сладкий","grams":80},{"name":"лук","grams":60},{"name":"масло растительное","grams":12}],"steps":["Обжарьте лук и перец, добавьте помидоры и тушите 8 минут.","Сделайте углубления, вбейте яйца.","Готовьте под крышкой до схватывания белка."],"time_minutes":25,"calories_kcal_estimated_total":400,"photo":"AliCook_80_фото/15.jpg"},{"id":16,"title":"Борщ","category":"Основные блюда","ingredients":[{"name":"говядина","grams":100},{"name":"свёкла","grams":120},{"name":"капуста","grams":120},{"name":"картофель","grams":100},{"name":"морковь","grams":50},{"name":"лук","grams":50},{"name":"томатная паста","grams":25},{"name":"вода","grams":600}],"steps":["Сварите мясной бульон.","Добавьте картофель и капусту.","Отдельно потушите свёклу, морковь, лук и томатную пасту.","Соедините и варите до готовности."],"time_minutes":85,"calories_kcal_estimated_total":380,"photo":"AliCook_80_фото/16.jpg"},{"id":17,"title":"Щи","category":"Основные блюда","ingredients":[{"name":"капуста","grams":180},{"name":"картофель","grams":120},{"name":"морковь","grams":60},{"name":"лук","grams":50},{"name":"курица","grams":100},{"name":"вода","grams":600}],"steps":["Сварите курицу до мягкости.","Добавьте картофель, затем капусту, морковь и лук.","Варите до мягкости овощей."],"time_minutes":55,"calories_kcal_estimated_total":290,"photo":"AliCook_80_фото/17.jpg"},{"id":18,"title":"Суп из чечевицы","category":"Основные блюда","ingredients":[{"name":"чечевица сухая","grams":90},{"name":"морковь","grams":70},{"name":"лук","grams":60},{"name":"томат","grams":80},{"name":"масло растительное","grams":10},{"name":"вода","grams":550}],"steps":["Промойте чечевицу.","Обжарьте лук с морковью, добавьте томат, чечевицу и воду.","Варите 25–30 минут."],"time_minutes":40,"calories_kcal_estimated_total":460,"photo":"AliCook_80_фото/18.jpg"},{"id":19,"title":"Гороховый суп","category":"Основные блюда","ingredients":[{"name":"горох сухой","grams":90},{"name":"картофель","grams":120},{"name":"морковь","grams":60},{"name":"лук","grams":50},{"name":"масло растительное","grams":8},{"name":"вода","grams":600}],"steps":["Замочите горох при необходимости.","Варите до размягчения, затем добавьте картофель и обжаренные овощи.","Доведите до готовности."],"time_minutes":75,"calories_kcal_estimated_total":470,"photo":"AliCook_80_фото/19.jpg"},{"id":20,"title":"Тушёная капуста","category":"Основные блюда","ingredients":[{"name":"капуста","grams":300},{"name":"морковь","grams":70},{"name":"лук","grams":60},{"name":"томатная паста","grams":25},{"name":"масло растительное","grams":15},{"name":"вода","grams":80}],"steps":["Обжарьте лук с морковью.","Добавьте нашинкованную капусту, томат и воду.","Тушите под крышкой 25–30 минут."],"time_minutes":40,"calories_kcal_estimated_total":260,"photo":"AliCook_80_фото/20.jpg"},{"id":21,"title":"Овощное рагу","category":"Основные блюда","ingredients":[{"name":"кабачок","grams":150},{"name":"баклажан","grams":120},{"name":"картофель","grams":120},{"name":"перец сладкий","grams":90},{"name":"помидоры","grams":120},{"name":"лук","grams":60},{"name":"масло растительное","grams":15}],"steps":["Нарежьте овощи.","Сначала обжарьте лук и картофель, затем добавьте остальные овощи.","Тушите под крышкой до мягкости."],"time_minutes":40,"calories_kcal_estimated_total":360,"photo":"AliCook_80_фото/21.jpg"},{"id":22,"title":"Салат с тунцом","category":"Основные блюда","ingredients":[{"name":"тунец консервированный","grams":120},{"name":"огурцы","grams":120},{"name":"помидоры","grams":120},{"name":"листья салата","grams":50},{"name":"масло оливковое","grams":10}],"steps":["Слейте жидкость с тунца.","Нарежьте овощи, смешайте с листьями салата и тунцом.","Заправьте маслом."],"time_minutes":10,"calories_kcal_estimated_total":310,"photo":"AliCook_80_фото/23.jpg"},{"id":23,"title":"Греческий салат","category":"Основные блюда","ingredients":[{"name":"помидоры","grams":150},{"name":"огурцы","grams":150},{"name":"сыр фета","grams":70},{"name":"маслины","grams":35},{"name":"масло оливковое","grams":12}],"steps":["Крупно нарежьте овощи и сыр.","Добавьте маслины, заправьте оливковым маслом."],"time_minutes":10,"calories_kcal_estimated_total":390,"photo":"AliCook_80_фото/27.jpg"},{"id":24,"title":"Салат из капусты","category":"Основные блюда","ingredients":[{"name":"капуста","grams":250},{"name":"морковь","grams":70},{"name":"масло растительное","grams":12},{"name":"лимонный сок","grams":10}],"steps":["Тонко нашинкуйте капусту, натрите морковь.","Слегка разомните капусту, добавьте сок и масло."],"time_minutes":10,"calories_kcal_estimated_total":200,"photo":"AliCook_80_фото/28.jpg"},{"id":25,"title":"Картофельная запеканка","category":"Основные блюда","ingredients":[{"name":"картофель","grams":250},{"name":"фарш мясной","grams":120},{"name":"лук","grams":60},{"name":"сыр","grams":40},{"name":"молоко","grams":50},{"name":"масло растительное","grams":10}],"steps":["Сварите картофель и разомните с молоком.","Обжарьте фарш с луком до готовности.","Уложите слоями, посыпьте сыром и запекайте 20 минут при 190 °C."],"time_minutes":55,"calories_kcal_estimated_total":650,"photo":"AliCook_80_фото/29.jpg"},{"id":26,"title":"Курица с гречкой","category":"Основные блюда","ingredients":[{"name":"курица","grams":180},{"name":"гречка сухая","grams":80},{"name":"лук","grams":60},{"name":"морковь","grams":60},{"name":"масло растительное","grams":12},{"name":"вода","grams":190}],"steps":["Обжарьте курицу и овощи.","Добавьте промытую гречку и воду, тушите под крышкой 20 минут до готовности."],"time_minutes":40,"calories_kcal_estimated_total":610,"photo":"AliCook_80_фото/30.jpg"},{"id":27,"title":"Спагетти с томатным соусом","category":"Основные блюда","ingredients":[{"name":"спагетти сухие","grams":100},{"name":"томаты протёртые","grams":180},{"name":"лук","grams":50},{"name":"чеснок","grams":8},{"name":"масло оливковое","grams":12}],"steps":["Отварите спагетти.","Обжарьте лук с чесноком, добавьте томаты и тушите 10 минут.","Соедините с пастой."],"time_minutes":25,"calories_kcal_estimated_total":490,"photo":"AliCook_80_фото/31.jpg"},{"id":28,"title":"Паста с грибами","category":"Основные блюда","ingredients":[{"name":"паста сухая","grams":100},{"na
