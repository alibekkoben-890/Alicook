арай тұз қосып, ыстық күйінде ұсыныңыз. Құс етін толық пісіріңіз."],"title_en":"Pan-fried beans with carrots","steps_en":["Prepare beans and carrots; chop vegetables and rinse grains where needed.","Peel and chop the onion and carrot.","Heat oil in a pan and sauté the onion for 3–4 minutes.","If using dried beans, soak them in advance and boil until fully cooked.","Add carrots and water, then stir.","Cook in a pan, stirring occasionally, until all ingredients are thoroughly cooked.","Season with salt to taste and serve hot. Make sure poultry is fully cooked."]},{"id":521,"title":"Бешбармак","title_kk":"Бесбармақ","title_en":"Beshbarmak","category":"Казахская кухня","ingredients":[{"name":"говядина","grams":800},{"name":"мука","grams":350},{"name":"яйцо","grams":55},{"name":"лук","grams":250},{"name":"вода","grams":1800},{"name":"соль","grams":12}],"steps":["Варите мясо в воде на слабом огне до мягкости, снимая пену.","Замесите крутое тесто из муки, яйца, воды и соли; дайте отдохнуть.","Раскатайте тесто тонко, нарежьте ромбами и сварите в бульоне.","Лук прогрейте в небольшом количестве бульона. Подавайте тесто с мясом и луком."],"steps_kk":["Етті көбігін алып, баяу отта жұмсарғанша пісіріңіз.","Ұн, жұмыртқа, су және тұздан қатты қамыр илеп, тынықтырыңыз.","Қамырды жұқа жайып, төртбұрыштап кесіңіз де, сорпада пісіріңіз.","Пиязды аздап сорпаға бұқтырып, қамыр мен еттің үстіне салыңыз."],"steps_en":["Simmer the meat in water until tender, skimming the broth.","Knead a firm dough with flour, egg, water and salt; let it rest.","Roll thin, cut into diamonds and cook in the broth.","Soften sliced onions in a little broth and serve over the noodles and meat."],"time_minutes":180,"calories_kcal_estimated_total":null,"photo":null},{"id":522,"title":"Қуырдақ","title_kk":"Қуырдақ","title_en":"Kuyrdak","category":"Казахская кухня","ingredients":[{"name":"баранина","grams":600},{"name":"картофель","grams":500},{"name":"лук","grams":200},{"name":"масло растительное","grams":35},{"name":"вода","grams":200},{"name":"соль","grams":10}],"steps":["Нарежьте баранину небольшими кусочками.","Обжарьте мясо с луком до лёгкой румяности.","Добавьте картофель, немного воды и соль.","Тушите под крышкой до полной готовности мяса и картофеля."],"steps_kk":["Қой етін ұсақтап тураңыз.","Ет пен пиязды аздап қызарғанша қуырыңыз.","Картоп, аздап су және тұз қосыңыз.","Ет пен картоп толық піскенше қақпақ астында бұқтырыңыз."],"steps_en":["Cut lamb into small pieces.","Brown the meat lightly with onions.","Add potatoes, a little water and salt.","Cover and simmer until the meat and potatoes are fully cooked."],"time_minutes":90,"calories_kcal_estimated_total":null,"photo":null},{"id":523,"title":"Бауырсаки","title_kk":"Бауырсақ","title_en":"Baursak","category":"Казахская кухня","ingredients":[{"name":"мука","grams":500},{"name":"молоко","grams":250},{"name":"дрожжи сухие","grams":7},{"name":"сахар","grams":20},{"name":"соль","grams":8},{"name":"масло растительное","grams":350}],"steps":["Смешайте тёплое молоко, дрожжи и сахар; дайте постоять 10 минут.","Добавьте муку и соль, замесите мягкое тесто и дайте подняться.","Раскатайте тесто и нарежьте небольшими кусочками.","Обжарьте партиями в разогретом масле до золотистого цвета; выложите на бумагу."],"steps_kk":["Жылы сүтке ашытқы мен қант қосып, 10 минут күтіңіз.","Ұн мен тұз қосып, жұмсақ қамыр илеп, көтерілгенше қойыңыз.","Қамырды жайып, кішкене бөліктерге кесіңіз.","Қызған майға бөліп салып, алтын түске дейін қуырыңыз."],"steps_en":["Mix warm milk, yeast and sugar; rest for 10 minutes.","Add flour and salt, knead a soft dough and let it rise.","Roll out and cut into small pieces.","Fry in batches in hot oil until golden, then drain on paper."],"time_minutes":110,"calories_kcal_estimated_total":null,"photo":null},{"id":524,"title":"Шелпек","title_kk":"Шелпек","title_en":"Shelpek flatbread","category":"Казахская кухня","ingredients":[{"name":"мука","grams":450},{"name":"вода","grams":220},{"name":"соль","grams":7},{"name":"масло растительное","grams":180}],"steps":["Смешайте муку, воду и соль, замесите упругое тесто.","Дайте тесту отдохнуть 20 минут.","Разделите на шарики и раскатайте тонкие лепёшки.","Обжарьте каждую лепёшку с двух сторон до золотистого цвета."],"steps_kk":["Ұн, су және тұздан серпімді қамыр илеңіз.","Қамырды 20 минут тынықтырыңыз.","Бөліктерге бөліп, жұқа шелпек етіп жайыңыз.","Әр шелпекті екі жағынан қызарғанша қуырыңыз."],"steps_en":["Knead flour, water and salt into an elastic dough.","Rest the dough for 20 minutes.","Divide and roll into thin rounds.","Fry each flatbread on both sides until golden."],"time_minutes":50,"calories_kcal_estimated_total":null,"photo":null},{"id":525,"title":"Сорпа из баранины","title_kk":"Қой сорпасы","title_en":"Lamb sorpa","category":"Казахская кухня","ingredients":[{"name":"баранина","grams":650},{"name":"вода","grams":1800},{"name":"лук","grams":150},{"name":"морковь","grams":160},{"name":"картофель","grams":350},{"name":"соль","grams":10}],"steps":["Положите баранину в холодную воду и доведите до кипения.","Снимите пену и варите на слабом огне до мягкости мяса.","Добавьте лук, морковь и картофель.","Варите до готовности овощей и посолите по вкусу."],"steps_kk":["Қой етін салқын суға салып, қайнатыңыз.","Көбігін алып, ет жұмсарғанша баяу пісіріңіз.","Пияз, сәбіз және картоп қосыңыз.","Көкөністер піскенше қайнатып, тұздаңыз."],"steps_en":["Place lamb in cold water and bring to a boil.","Skim the broth and simmer until the meat is tender.","Add onions, carrots and potatoes.","Cook until the vegetables are tender and season with salt."],"time_minutes":130,"calories_kcal_estimated_total":null,"photo":null},{"id":526,"title":"Кеспе көже","title_kk":"Кеспе көже","title_en":"Kazakh noodle soup","category":"Казахская кухня","ingredients":[{"name":"говядина","grams":450},{"name":"мука","grams":200},{"name":"яйцо","grams":55},{"name":"лук","grams":130},{"name":"морковь","grams":130},{"name":"вода","grams":1600},{"name":"соль","grams":9}],"steps":["Сварите говядину в воде до мягкости.","Замесите тесто из муки, яйца и небольшого количества воды, раскатайте и нарежьте лапшу.","Добавьте в бульон лук и морковь, варите до мягкости.","Опустите лапшу в кипящий бульон и варите до готовности."],"steps_kk":["Сиыр етін суға жұмсарғанша пісіріңіз.","Ұн, жұмыртқа және аздап судан қамыр илеп, жұқа кеспе кесіңіз.","Сорпаға пияз бен сәбіз қосып, жұмсарғанша қайнатыңыз.","Кеспені қайнап тұрған сорпаға салып, піскенше қайнатыңыз."],"steps_en":["Simmer beef in water until tender.","Make a dough with flour, egg and a little water; roll thin and cut noodles.","Add onions and carrots to the broth and cook until tender.","Add noodles to the boiling broth and cook through."],"time_minutes":120,"calories_kcal_estimated_total":null,"photo":null},{"id":527,"title":"Таба нан","title_kk":"Таба нан","title_en":"Taba nan bread","category":"Казахская кухня","ingredients":[{"name":"мука","grams":500},{"name":"вода","grams":280},{"name":"дрожжи сухие","grams":7},{"name":"соль","grams":8},{"name":"сахар","grams":10},{"name":"масло растительное","grams":20}],"steps":["Растворите дрожжи и сахар в тёплой воде.","Добавьте муку, соль и масло, замесите тесто и дайте подняться.","Сформируйте круглую лепёшку и положите на разогретую толстостенную сковороду.","Готовьте на слабом огне под крышкой, перевернув, до полного пропекания."],"steps_kk":["Жылы суға ашытқы мен қантты ерітіңіз.","Ұн, тұз және май қосып, қамыр илеп, көтерілгенше қойыңыз.","Домалақ нан жасап, қызған қалың табаға салыңыз.","Қақпақ астында баяу отта екі жағын толық піскенше пісіріңіз."],"steps_en":["Dissolve yeast and sugar in warm water.","Add flour, salt and oil, knead and let rise.","Shape into a round loaf and place in a heated heavy pan.","Cook covered over low heat, turning once, until baked through."],"time_minutes":110,"calories_kcal_estimated_total":null,"photo":null},{"id":528,"title":"Сүт көже","title_kk":"Сүт көже","title_en":"Milk and rice soup","category":"Казахская кухня","ingredients":[{"name":"молоко","grams":900},{"name":"вода","grams":500},{"name":"рис","grams":130},{"name":"соль","grams":4},{"name":"масло сливочное","grams":20}],"steps":["Промойте рис до прозрачной воды.","Варите рис в воде до почти полной готовности.","Влейте молоко и готовьте на слабом огне, помешивая.","Добавьте соль и сливочное масло, подавайте тёплым."],"steps_kk":["Күрішті суы мөлдір болғанша жуыңыз.","Күрішті суда жұмсарғанша пісіріңіз.","Сүт құйып, баяу отта араластыра отырып қайнатыңыз.","Тұз бен сары май қосып, жылы күйінде ұсыныңыз."],"steps_en":["Rinse rice thoroughly.","Cook rice in water until nearly tender.","Add milk and simmer gently, stirring.","Add salt and butter and serve warm."],"time_minutes":40,"calories_kcal_estimated_total":null,"photo":null},{"id":529,"title":"Майсөк","title_kk":"Майсөк","title_en":"Maisok millet snack","category":"Казахская кухня","ingredients":[{"name":"пшено","grams":300},{"name":"масло сливочное","grams":90},{"name":"сахар","grams":60},{"name":"молоко","grams":150}],"steps":["Промойте пшено и отварите до мягкости, затем слейте лишнюю воду.","Слегка подсушите крупу на сковороде, помешивая.","Смешайте с растопленным маслом и сахаром.","Добавьте немного тёплого молока и подавайте."],"steps_kk":["Тары жармасын жуып, жұмсарғанша пісіріп, артық суын төгіңіз.","Жарманы табада араластырып, сәл кептіріңіз.","Еріген сары май мен қантты қосыңыз.","Аздап жылы сүт құйып, ұсыныңыз."],"steps_en":["Rinse and cook millet until tender, then drain.","Dry it briefly in a pan while stirring.","Mix with melted butter and sugar.","Add a little warm milk and serve."],"time_minutes":40,"calories_kcal_estimated_total":null,"photo":null},{"id":530,"title":"Құймақ","title_kk":"Құймақ","title_en":"Kazakh pancakes","category":"Казахская кухня","ingredients":[{"name":"мука","grams":250},{"name":"молоко","grams":450},{"name":"яйца","grams":110},{"name":"сахар","grams":30},{"name":"масло растительное","grams":35},{"name":"соль","grams":3}],"steps":["Взбейте яйца с молоком, сахаром и солью.","Постепенно вмешайте муку до гладкого жидкого теста.","Добавьте немного масла и разогрейте сковороду.","Жарьте тонкие блины с двух сторон до готовности."],"steps_kk":["Жұмыртқаны сүт, қант және тұзбен шайқаңыз.","Ұнды біртіндеп қосып, сұйық қамыр дайындаңыз.","Аздап май қосып, табаны қыздырыңыз.","Жұқа құймақтарды екі жағынан пісіріңіз."],"steps_en":["Whisk eggs with milk, sugar and salt.","Gradually whisk in flour to make a smooth thin batter.","Add a little oil and heat a frying pan.","Cook thin pancakes on both sides until done."],"time_minutes":35,"calories_kcal_estimated_total":null,"photo":null},{"id":531,"title":"Қарақұмық ботқасы","title_kk":"Қарақұмық ботқасы","title_en":"Buckwheat porridge","category":"Казахская кухня","ingredients":[{"name":"гречка","grams":250},{"name":"вода","grams":550},{"name":"масло сливочное","grams":40},{"name":"соль","grams":5}],"steps":["Промойте гречку.","Доведите воду до кипения, добавьте крупу и соль.","Варите под крышкой на слабом огне до впитывания воды.","Добавьте сливочное масло и дайте настояться."],"steps_kk":["Қарақұмықты жуыңыз.","Суды қайнатып, жарма мен тұз қосыңыз.","Суы сіңгенше баяу отта қақпақ астында пісіріңіз.","Сары май қосып, біраз демдеңіз."],"steps_en":["Rinse the buckwheat.","Bring water to a boil and add buckwheat and salt.","Simmer covered until the water is absorbed.","Stir in butter and let rest."],"time_minutes":35,"calories_kcal_estimated_total":null,"photo":null},{"id":532,"title":"Жент","title_kk":"Жент","title_en":"Zhent sweet","category":"Казахская кухня","ingredients":[{"name":"талқан","grams":300},{"name":"масло сливочное","grams":120},{"name":"сахар","grams":100},{"name":"изюм","grams":90}],"steps":["Растопите сливочное масло на слабом огне.","Смешайте талқан, сахар и изюм.","Влейте масло и тщательно перемешайте.","Плотно утрамбуйте массу в форму и охладите."],"steps_kk":["Сары майды баяу отта ерітіңіз.","Талқан, қант және мейізді араластырыңыз.","Майды құйып, жақсылап араластырыңыз.","Қалыпқа нығыздап салып, суытыңыз."],"steps_en":["Melt the butter over low heat.","Combine roasted grain flour, sugar and raisins.","Add the butter and mix thoroughly.","Press into a mold and chill."],"time_minutes":30,"calories_kcal_estimated_total":null,"photo":null},{"id":533,"title":"Бал куырдак","title_kk":"Балқуырдақ","title_en":"Bal kuyrdak (lamb in cream)","category":"Казахская кухня","ingredients":[{"name":"баранина","grams":650},{"name":"сливки 20%","grams":250},{"name":"лук","grams":160},{"name":"соль","grams":8},{"name":"перец чёрный","grams":2}],"steps":["Нарежьте молодую баранину небольшими кусочками, лук — тонкими полукольцами.","Разогрейте густые сливки в толстостенной сковороде или казане на слабом огне.","Добавьте мясо и лук; готовьте, помешивая, без сильного кипения.","Посолите, поперчите и томите до полной готовности и мягкости мяса; при необходимости добавьте немного воды."],"steps_kk":["Жас қой етін ұсақтап, пиязды жұқа жарты сақина етіп тураңыз.","Қою қаймақты қалың табада немесе қазанда баяу отта қыздырыңыз.","Ет пен пиязды қосып, қатты қайнатпай араластырып пісіріңіз.","Тұз бен бұрыш қосып, ет толық пісіп жұмсарғанша бұқтырыңыз; қажет болса аздап су құйыңыз."],"steps_en":["Cut tender lamb into small pieces and slice the onion thinly.","Warm thick cream gently in a heavy pan or kazan.","Add lamb and onion; cook gently, stirring, without a vigorous boil.","Season with salt and pepper and simmer until the lamb is fully cooked and tender; add a little water if needed."],"time_minutes":85,"calories_kcal_estimated_total":null,"photo":null},{"id":534,"title":"Өрметөстік","title_kk":"Өрметөстік","title_en":"Orme tostik (braided lamb breast)","ingredients":[{"name":"грудинка баранья","grams":850},{"name":"кишки бараньи очищенные","grams":250},{"name":"чеснок","grams":20},{"name":"соль","grams":12},{"name":"перец чёрный","grams":3},{"name":"вода","grams":2000}],"steps":["Подготовьте баранью грудинку и тщательно очищенные пищевые кишки.","Натрите мясо солью, перцем и чесноком, оставьте на 1–2 часа в холодильнике.","Сверните грудинку рулетом, обвяжите или оплетите подготовленными кишками.","Варите при слабом кипении примерно 2–3 часа до полной готовности мяса."],"steps_kk":["Қойдың төс етін және тағамға арналған мұқият тазартылған ішекті дайындаңыз.","Етке тұз, бұрыш, сарымсақ жағып, тоңазытқышта 1–2 сағат ұстаңыз.","Төсті орап, дайындалған ішекпен өріп бекітіңіз.","Баяу қайнаған суда шамамен 2–3 сағат ет толық піскенше қайнатыңыз."],"steps_en":["Prepare lamb breast and thoroughly cleaned food-grade intestines.","Rub the meat with salt, pepper and garlic; refrigerate for 1–2 hours.","Roll the breast and secure it with braided prepared intestine.","Simmer gently for about 2–3 hours until the meat is fully cooked."],"time_minutes":300,"category":"Казахская кухня","calories_kcal_estimated_total":null,"photo":null},{"id":535,"title":"Қарын бүрме","title_kk":"Қарын бүрме","title_en":"Qaryn burme (stuffed lamb stomach)","ingredients":[{"name":"желудок бараний очищенный","grams":600},{"name":"баранина","grams":700},{"name":"картофель","grams":450},{"name":"морковь","grams":200},{"name":"лук","grams":180},{"name":"помидоры","grams":200},{"name":"соль","grams":12},{"name":"перец чёрный","grams":3}],"steps":["Используйте тщательно очищенный пищевой бараний желудок.","Нарежьте мясо и овощи крупными кусками, перемешайте с солью и перцем.","Наполните желудок неплотно, оставив место для расширения начинки, и надёжно закройте отверстие.","Погрузите в воду и варите при слабом кипении около 3–4 часов до полной готовности начинки; подавайте горячим."],"steps_kk":["Тағамға арналған мұқият тазартылған қой қарнын алыңыз.","Ет пен көкөністерді ірі турап, тұз және бұрышпен араластырыңыз.","Қарынға қоспаны нығыздамай салып, аузын мықтап бекітіңіз.","Суға салып, баяу отта шамамен 3–4 сағат ішіндегі ет толық піскенше қайнатып, ыстықтай ұсыныңыз."],"steps_en":["Use a thoroughly cleaned food-grade lamb stomach.","Cut meat and vegetables into large pieces; season with salt and pepper.","Fill the stomach loosely, allowing room for expansion, and close it securely.","Submerge in water and simmer gently for about 3–4 hours until the filling is fully cooked; serve hot."],"time_minutes":270,"category":"Казахская кухня","calories_kcal_estimated_total":null,"photo":null},{"id":536,"title":"Сірне","title_kk":"Сірне","title_en":"Sirne (slow-braised young lamb)","ingredients":[{"name":"молодая баранина","grams":1000},{"name":"сливки 20%","grams":350},{"name":"лук","grams":150},{"name":"соль","grams":12},{"name":"вода","grams":100}],"steps":["Разделите мясо молодого барашка на порционные куски.","Выложите мясо и нарезанный лук в толстостенный казан, добавьте соль.","Влейте сливки и немного воды, плотно накройте крышкой.","Томите на самом слабом огне 2–3 часа до полной готовности и мягкости мяса, при необходимости добавляя немного воды."],"steps_kk":["Жас қой етін порцияларға бөліңіз.","Ет пен туралған пиязды қалың қазанға салып, тұз қосыңыз.","Қаймақ пен аздап су құйып, қақпағын тығыз жабыңыз.","Ет толық пісіп жұмсарғанша өте баяу отта 2–3 сағат бұқтырыңыз, қажет болса аздап су қосыңыз."],"steps_en":["Cut young lamb into serving pieces.","Place the meat and sliced onion in a heavy pot and season with salt.","Pour in cream and a little water, then cover tightly.","Braise on very low heat for 2–3 hours until the lamb is fully cooked and tender, adding a little water if needed."],"time_minutes":190,"category":"Казахская кухня","calories_kcal_estimated_total":null,"photo":null}],"detailed_recipes":[{"id":1,"title":"Омлет с сыром","category":"Основные блюда","ingredients":[{"name":"яйца","grams":110},{"name":"сыр","grams":35},{"name":"молоко","grams":30},{"name":"масло сливочное","grams":8}],"steps":["Взбейте яйца с молоком.","Натрите сыр.","Растопите масло, влейте смесь и готовьте под крышкой 4–5 минут.","Посыпьте сыром и прогрейте до расплавления."],"time_minutes":10,"calories_kcal_estimated_total":340,"photo":"AliCook_80_фото/01.jpg"},{"id":2,"title":"Жареный картофель","category":"Основные блюда","ingredients":[{"name":"картофель","grams":250},{"name":"масло растительное","grams":18},{"name":"лук","grams":50}],"steps":["Нарежьте картофель брусочками, промойте и обсушите.","Обжаривайте в масле 15–18 минут, периодически переворачивая.","Добавьте лук и доведите до готовности."],"time_minutes":25,"calories_kcal_estimated_total":370,"photo":"AliCook_80_фото/02.jpg"},{"id":3,"title":"Картофельное пюре","category":"Основные блюда","ingredients":[{"name":"картофель","grams":250},{"name":"молоко","grams":70},{"name":"масло сливочное","grams":15}],"steps":["Отварите очищенный картофель 20 минут.","Слейте воду, разомните, добавьте тёплое молоко и масло.","Перемешайте до однородности."],"time_minutes":30,"calories_kcal_estimated_total":320,"photo":"AliCook_80_фото/03.jpg"},{"id":4,"title":"Салат из огурцов и помидоров","category":"Основные блюда","ingredients":[{"name":"огурцы","grams":150},{"name":"помидоры","grams":150},{"name":"лук","grams":25},{"name":"масло растительное","grams":10}],"steps":["Вымойте овощи.","Нарежьте ломтиками, лук — тонкими полукольцами.","Посолите и заправьте маслом перед подачей."],"time_minutes":10,"calories_kcal_estimated_total":145,"photo":"AliCook_80_фото/04.jpg"},{"id":5,"title":"Макароны с сыром","category":"Основные блюда","ingredients":[{"name":"макароны сухие","grams":90},{"name":"сыр","grams":45},{"name":"молоко","grams":60},{"name":"масло сливочное","grams":10}],"steps":["Отварите макароны до готовности.","Подогрейте молоко с маслом, добавьте тёртый сыр.","Смешайте соус с макаронами."],"time_minutes":20,"calories_kcal_estimated_total":550,"photo":"AliCook_80_фото/05.jpg"},{"id":6,"title":"Гречка с луком","category":"Основные блюда","ingredients":[{"name":"гречка сухая","grams":80},{"name":"лук","grams":80},{"name":"масло растительное","grams":12},{"name":"вода","grams":180}],"steps":["Промойте г ,"grams":170}],"steps":["Отварите рис.","Нарежьте овощи, обжарьте 5–7 минут, добавьте горошек.","Смешайте с рисом и прогрейте."],"time_minutes":30,"calories_kcal_estimated_total":430,"photo":"AliCook_80_фото/10.jpg"},{"id":11,"title":"Котлеты из фарша","category":"Основные блюда","ingredients":[{"name":"фарш мясной","grams":180},{"name":"лук","grams":50},{"name":"яйцо","grams":25},{"name":"сухари панировочные","grams":20},{"name":"масло растительное","grams":12}],"steps":["Смешайте фарш с луком, яйцом и сухарями.","Сформируйте котлеты.","Обжарьте с двух сторон и доведите под крышкой до полной готовности."],"time_minutes":30,"calories_kcal_estimated_total":540,"photo":"AliCook_80_фото/11.jpg"},{"id":12,"title":"Оладьи","category":"Основные блюда","ingredients":[{"name":"кефир","grams":160},{"name":"мука","grams":120},{"name":"яйцо","grams":50},{"name":"сахар","grams":12},{"name":"масло растительное","grams":12},{"name":"разрыхлитель","grams":4}],"steps":["Смешайте кефир, яйцо и сахар.","Введите муку и разрыхлитель.","Жарьте небольшие оладьи на умеренном огне по 2–3 минуты с каждой стороны."],"time_minutes":25,"calories_kcal_estimated_total":640,"photo":"AliCook_80_фото/12.jpg"},{"id":13,"title":"Блины","category":"Основные блюда","ingredients":[{"name":"молоко","grams":200},{"name":"мука","grams":100},{"name":"яйцо","grams":50},{"name":"сахар","grams":10},{"name":"масло растительное","grams":10}],"steps":["Взбейте молоко с яйцом.","Добавьте муку и сахар, затем масло.","Выпекайте тонкие блины на разогретой сковороде."],"time_minutes":25,"calories_kcal_estimated_total":600,"photo":"AliCook_80_фото/13.jpg"},{"id":14,"title":"Сырники","category":"Основные блюда","ingredients":[{"name":"творог","grams":180},{"name":"яйцо","grams":25},{"name":"мука","grams":35},{"name":"сахар","grams":15},{"name":"масло растительное","grams":10}],"steps":["Разотрите творог с яйцом и сахаром.","Добавьте муку, сформируйте сырники.","Жарьте на среднем огне до готовности с двух сторон."],"time
