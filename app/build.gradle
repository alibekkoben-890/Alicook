plugins { id 'com.android.application' }
android {
    namespace 'com.alicook.app'
    compileSdk 35
    signingConfigs {
        release {
            if (System.getenv('ALICOOK_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ALICOOK_KEYSTORE_PATH'))
                storePassword System.getenv('ALICOOK_STORE_PASSWORD')
                keyAlias System.getenv('ALICOOK_KEY_ALIAS')
                keyPassword System.getenv('ALICOOK_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // Use the same permanent key as release so every APK can update the installed app.
            if (System.getenv('ALICOOK_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    defaultConfig {
        applicationId 'com.alicook.recipes.v2'
        minSdk 24
        targetSdk 35
        versionCode 66
        versionName '1.64'
    }
}
