plugins { id 'com.android.application' }
android {
    namespace 'com.alicook.app'
    compileSdk 35
    signingConfigs {
        release {
            if (System.getenv('ALICOOK_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ALICOOK_KEYSTORE_PATH'))
                storePassword System.getenv('ALICOOK_STORE_PASSWORD')
                keyAlias System.getenv('ALICOOK_KEY_ALIAS')
                keyPassword System.getenv('ALICOOK_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    defaultConfig {
        applicationId 'com.alicook.recipes.translated'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '1.6'
    }
}
