name: Real dish photos search

# Looks for real photos (Wikimedia Commons first, then Pixabay and Openverse) for the recipes listed
# in tools/photos/real_queries.json and publishes contact sheets to the photo-work-real-N branches.
on:
  workflow_dispatch:
  push:
    branches: ['photos-real']
    paths: ['tools/photos/real_queries.json']

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0
      - name: Search
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python tools/photos/real_search.py tools/photos/real_queries.json out ${{ matrix.shard }} 8
      - name: Publish to a work branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Real photo search results, shard ${{ matrix.shard }}, run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:photo-work-real-${{ matrix.shard }}
