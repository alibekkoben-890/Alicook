name: Build signed AliCook release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'app/**'
      - '.github/scripts/**'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Require signing credentials
        env:
          KEYSTORE_B64: ${{ secrets.ALICOOK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ALICOOK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALICOOK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALICOOK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_B64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::Release signing secrets are not configured. Set ALICOOK_KEYSTORE_BASE64, ALICOOK_STORE_PASSWORD, ALICOOK_KEY_ALIAS and ALICOOK_KEY_PASSWORD in repository Actions secrets."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/alicook-release.jks"
          chmod 600 "$RUNNER_TEMP/alicook-release.jks"
      - name: Build signed release APK
        env:
          ALICOOK_KEYSTORE_PATH: ${{ runner.temp }}/alicook-release.jks
          ALICOOK_STORE_PASSWORD: ${{ secrets.ALICOOK_STORE_PASSWORD }}
          ALICOOK_KEY_ALIAS: ${{ secrets.ALICOOK_KEY_ALIAS }}
          ALICOOK_KEY_PASSWORD: ${{ secrets.ALICOOK_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Check APK (signature, not debuggable, targetSdk, permissions)
        run: bash .github/scripts/verify-apk.sh app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AliCook-SIGNED-RELEASE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
