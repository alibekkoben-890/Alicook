name: Build Ali Cook APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Load permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ALICOOK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ALICOOK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALICOOK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALICOOK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_B64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::Signing secrets are not configured. Set ALICOOK_KEYSTORE_BASE64, ALICOOK_STORE_PASSWORD, ALICOOK_KEY_ALIAS and ALICOOK_KEY_PASSWORD in repository Actions secrets."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/alicook-release.jks"
          chmod 600 "$RUNNER_TEMP/alicook-release.jks"

      - name: Build release APK
        env:
          ALICOOK_KEYSTORE_PATH: ${{ runner.temp }}/alicook-release.jks
          ALICOOK_STORE_PASSWORD: ${{ secrets.ALICOOK_STORE_PASSWORD }}
          ALICOOK_KEY_ALIAS: ${{ secrets.ALICOOK_KEY_ALIAS }}
          ALICOOK_KEY_PASSWORD: ${{ secrets.ALICOOK_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Check APK (signature, not debuggable, targetSdk, permissions)
        run: bash .github/scripts/verify-apk.sh app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AliCook-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
