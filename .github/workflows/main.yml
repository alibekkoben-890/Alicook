
name: Build Ali Cook APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Keep signing key for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: alicook-multilang-debug-signing-v1

      - name: Require consistent signing key
        run: |
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "::error::Stable signing key missing. Refusing to publish APK with a new untrusted debug certificate."
            echo "Configure release signing via repository Actions secrets and use the signed release workflow."
            exit 1
          fi

      - name: Build APK
        run: |
          
          gradle assembleDebug

      - name: Verify APK before publishing
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          echo "Android SDK build-tools:"
          ls -1 "$ANDROID_HOME/build-tools"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$TOOLS" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -15
          unzip -l "$APK" | grep 'assets/index.html'
          unzip -p "$APK" assets/index.html | grep -q 'catalog'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AliCook-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
